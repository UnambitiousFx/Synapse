name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer reads the pushed v* tag to derive the version

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Synapse.slnx

      # No /p:Version here: MinVer derives it from the pushed v* tag. A command-line /p:Version would
      # also override the preview pin in src/Directory.Build.targets (Synapse.Endpoints stays -preview).
      - name: Build
        run: dotnet build Synapse.slnx --no-restore --configuration Release

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./local_packages/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ./local_packages/*.snupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate