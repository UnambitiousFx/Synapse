name: PR title

# Squash merges use the PR title as the commit message, and semantic-release derives the version from it.
# `pull_request` is enough: the check only reads the title, so a read-only token (fork PRs included) suffices.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
