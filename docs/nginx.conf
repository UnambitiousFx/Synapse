server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers so trailing-slash redirects keep the
    # caller's host and port (published port, reverse proxy, etc.).
    absolute_redirect off;

    # Docusaurus emits trailing-slash directories; serve their index.html.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Hashed assets are immutable; HTML must stay revalidated so a redeploy shows up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
